name: Security CI

# Runs on demand only, so nothing lands in your inbox. Start it from the
# Actions tab or with `gh workflow run "Security CI"`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, iconv, mbstring, mysqli, pcntl, sodium, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Lint PHP
        shell: bash
        run: git ls-files -z '*.php' ':!:vendor/**' | xargs -0 -r -n1 php -l

      - name: Run security regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*_test.php; do
            php "$test_file"
          done

      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files -z '*.js' | xargs -0 -r -n1 node --check

      - name: Run client behavior regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*_runtime_test.js; do
            node "$test_file"
          done

      - name: Reject whitespace errors
        # Check only newly introduced changes; this legacy repository still has
        # historical whitespace debt that must not make every CI run fail.
        shell: bash
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ "$CHECK_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$CHECK_BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "$CHECK_BASE_SHA^{commit}"; then
            git diff --check "$CHECK_BASE_SHA" HEAD
          elif git rev-parse -q --verify HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          else
            # Root commit: there is no parent, so compare against the empty tree.
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

  secrets:
    name: Current-tree secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Scan tracked content with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: dir /github/workspace --redact --no-banner --verbose

  vectors:
    name: RFC 9420 known-answer tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The application needs no Rust toolchain, and neither does verifying the
      # committed artifacts' digests. This job exists so the vectors themselves
      # can be run by anyone, on a clean machine, without taking our word for it.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show && rustc --version && cargo --version

      - name: Run the MLS working group's vectors
        shell: bash
        working-directory: crypto
        run: cargo test --test rfc9420_vectors -- --nocapture

      # The protocol-level suites sit behind `#[cfg(test)]` upstream, so they run
      # through OpenMLS's own harness, against a crate archive checked against
      # our lock file.
      - name: Run the protocol-level suites through OpenMLS's harness
        shell: bash
        run: crypto/vectors/upstream-kats.sh

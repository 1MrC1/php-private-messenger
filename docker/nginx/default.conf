# Development server block. The rules mirror docs/nginx.conf; only the listener,
# the TLS block and the FastCGI host differ. If you change one, change both.
server {
    listen 80;
    server_name localhost;
    root /var/www/messenger;
    index index.html;
    autoindex off;
    client_max_body_size 51m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; manifest-src 'self'; worker-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location ~ ^/(?:classes|config|crypto|docs|migrations|tests|vendor|websocket)(?:/|$) { return 403; }
    location ^~ /uploads/ { return 403; }
    location ~ /\. { return 403; }
    location ~* ^.*/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|phpunit\.xml(?:\.dist)?|.*~|.*\.(?:env|log|ini|conf|config|bak|backup|old|orig|rej|tmp|temp|swp|swo|sql|sqlite|sqlite3|db|pem|key|p12|pfx|crt|cer|inc|phps|dist|map))$ { return 403; }

    location = /api/auth.php     { client_max_body_size 32k;  include /etc/nginx/conf.d/php.inc; }
    location = /api/settings.php { client_max_body_size 128k; include /etc/nginx/conf.d/php.inc; }
    location = /api/profile.php  { client_max_body_size 6m;   include /etc/nginx/conf.d/php.inc; }
    location = /api/chat.php     { client_max_body_size 51m;  include /etc/nginx/conf.d/php.inc; }

    location ~ ^/api/(?:attachment|avatar)\.php$ {
        client_max_body_size 1k;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        include /etc/nginx/conf.d/php.inc;
    }

    location ~ \.php(?:/|$) { return 403; }

    location ~* \.(?:css|js|png|jpe?g|gif|webp|woff2|ico)$ { expires 1M; access_log off; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/xml;
}

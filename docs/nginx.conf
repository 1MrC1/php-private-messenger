# nginx configuration for php-private-messenger.
#
# This is a complete translation of the shipped .htaccess. The Apache rules are
# security controls, not conveniences: an nginx server that merely serves the
# files leaves every internal PHP file readable over HTTP. Port all of it.
#
# Substitute your own server_name, root, certificate paths and PHP-FPM socket.
# Verify with the three checks at the bottom of this file before going live.
#
# A warning specific to nginx: `add_header` does NOT accumulate across levels.
# A location block that sets any header discards every add_header inherited from
# the server block. That is why the header set is repeated in full inside the
# locations that need a different policy — if you factor it out, those responses
# silently lose their security headers.

server {
    listen 443 ssl;
    http2 on;
    server_name messenger.example;

    root /var/www/messenger;
    index index.html;

    ssl_certificate     /etc/ssl/certs/messenger.example.pem;
    ssl_certificate_key /etc/ssl/private/messenger.example.key;

    # Apache: Options -Indexes -MultiViews
    autoindex off;

    # Apache: LimitRequestBody on the largest endpoint. Per-endpoint limits are
    # set in their own location blocks below; this is the ceiling.
    client_max_body_size 51m;

    # ---- security headers (application responses) --------------------------
    # Mirrors the env=!PM_PRIVATE_MEDIA branch of the .htaccess policy.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; manifest-src 'self'; worker-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    more_clear_headers 'X-Powered-By';   # requires headers-more-nginx-module; otherwise set expose_php=Off in php.ini

    # ---- internal directories: never reachable -----------------------------
    # Apache: RewriteRule ^(?:classes|config|crypto|docs|migrations|tests|vendor|websocket)(?:/|$)
    location ~ ^/(?:classes|config|crypto|docs|migrations|tests|vendor|websocket)(?:/|$) {
        return 403;
    }

    # Apache: stored media is never addressable; uploads/.htaccess denies all.
    location ^~ /uploads/ {
        return 403;
    }

    # Apache: RewriteRule "(^|/)\." — dot paths denied, ACME the one exception.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }
    location ~ /\. {
        return 403;
    }

    # Apache: deployment metadata, credentials, backups, logs, source maps.
    location ~* ^.*/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|phpunit\.xml(?:\.dist)?|.*~|.*\.(?:env|log|ini|conf|config|bak|backup|old|orig|rej|tmp|temp|swp|swo|sql|sqlite|sqlite3|db|pem|key|p12|pfx|crt|cer|inc|phps|dist|map))$ {
        return 403;
    }

    # ---- the six executable endpoints --------------------------------------
    # Everything else ending in .php is denied by the catch-all further down.
    # Each block repeats the per-endpoint body limit from .htaccess.

    location = /api/auth.php     { client_max_body_size 32k;  include /etc/nginx/snippets/messenger-php.conf; }
    location = /api/settings.php { client_max_body_size 128k; include /etc/nginx/snippets/messenger-php.conf; }
    location = /api/profile.php  { client_max_body_size 6m;   include /etc/nginx/snippets/messenger-php.conf; }
    location = /api/chat.php     { client_max_body_size 51m;  include /etc/nginx/snippets/messenger-php.conf; }

    # Private media delivery. These two carry the sandboxed policy, matching the
    # env=PM_PRIVATE_MEDIA branch in .htaccess. Every header is restated because
    # add_header here replaces the server-level set.
    location ~ ^/api/(?:attachment|avatar)\.php$ {
        client_max_body_size 1k;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        include /etc/nginx/snippets/messenger-php.conf;
    }

    # Apache: RewriteCond !^/api/(?:…)\.php$ then RewriteRule \.php(?:/|$) - [F]
    # Anything else that looks like PHP — including path-info tricks such as
    # /index.html/x.php — never reaches the interpreter.
    location ~ \.php(?:/|$) {
        return 403;
    }

    # ---- static assets ------------------------------------------------------
    location ~* \.(?:css|js|png|jpe?g|gif|webp|woff2|ico)$ {
        expires 1M;
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------------
    # Apache sends anything that is not a real file or directory to index.html,
    # excluding /api/, /uploads/ and /websocket/.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/xhtml+xml application/javascript application/rss+xml;
}

# Redirect plain HTTP, matching the commented-out Apache rule.
server {
    listen 80;
    server_name messenger.example;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# /etc/nginx/snippets/messenger-php.conf
#
#   fastcgi_pass         unix:/run/php/php8.2-fpm.sock;
#   fastcgi_split_path_info ^(.+\.php)(/.+)$;
#   fastcgi_index        index.php;
#   include              fastcgi_params;
#   fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
#   fastcgi_param        PATH_INFO       $fastcgi_path_info;
#   # PATH_INFO must not let /api/chat.php/evil.png reach a different script.
#   try_files            $uri =404;
#
# Configuration comes from the PHP-FPM pool, not from nginx: set PM_DB_*,
# PM_BACKUP_CODE_PEPPER and PM_TOTP_ENCRYPTION_KEY with env[...] there.
# ---------------------------------------------------------------------------

# Verification — all three must hold before this is live:
#
#   curl -sS -o /dev/null -w '%{http_code}\n' https://messenger.example/
#       -> 200   the application loads
#   curl -sS -o /dev/null -w '%{http_code}\n' https://messenger.example/classes/Chat.php
#       -> 403   internal code is not readable
#   curl -sS -o /dev/null -w '%{http_code}\n' https://messenger.example/uploads/avatars/any
#       -> 403   stored media is not directly addressable
#
# Also confirm, because these are the ones people get wrong:
#   /api/admin.php            -> 403 (not in the allow-list)
#   /.env                     -> 403
#   /composer.json            -> 403
#   /index.html/x.php         -> 403 (path-info smuggling)
#   /api/chat.php             -> 405 or 401, never 403 — it must still work
